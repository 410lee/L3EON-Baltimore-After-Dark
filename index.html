<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>L3EON — Baltimore After Dark</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#08060b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{min-height:100dvh;padding:15px 14px;background:radial-gradient(circle at 50% -10%,#52235f,#08060b 65%)}.top{height:55px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;letter-spacing:2px;font-size:23px}.logo i{color:#b879ff;font-style:normal}.night,.badge{font-size:10px;padding:7px 10px;border-radius:99px;background:#1b1222;border:1px solid #473151;color:#d9c8df}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:9px}.stat{background:#120c17;border:1px solid #32213c;border-radius:12px;text-align:center;padding:6px 2px;color:#a99aaa;font-size:8px}.stat b{display:block;color:#fff;font-size:13px}.energy{height:5px;background:#0d0910;border-radius:99px;overflow:hidden;margin-top:4px}.energy span{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#ef78df)}.card{background:#17101f;border:1px solid #3b2746;border-radius:20px;padding:15px;margin-bottom:10px;box-shadow:0 14px 35px #0009}h1{font-size:32px;line-height:1;margin:7px 0}h2{font-size:21px;margin:2px 0 7px}h3{margin:0 0 5px}p{color:#c1b3c8;line-height:1.42}.hero{text-align:center}.heroIcon{font-size:56px}.btn{width:100%;border:0;border-radius:15px;padding:14px;margin:5px 0;color:#fff;font-size:15px;font-weight:900;background:linear-gradient(135deg,#8054dd,#d35fdc);box-shadow:0 8px 18px #0007}.alt{background:#25172e;border:1px solid #513667;box-shadow:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{min-height:115px;text-align:left;padding:13px;border-radius:16px;border:1px solid #493057;background:#1a1022;color:#fff}.tile span{display:block;font-size:28px}.tile b{display:block;font-size:15px}.tile small{color:#b9a9c0;line-height:1.3}.list{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #2d2034;color:#b9adbe}.list:last-child{border:0}.list b{color:#fff}.toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#21132d;border:1px solid #9b68ca;border-radius:17px;padding:13px 17px;font-weight:900;z-index:20;box-shadow:0 18px 40px #000b;text-align:center}.footer{text-align:center;color:#6f6375;font-size:10px}</style></head><body><div class="app"><div class="top"><div class="logo">L3<i>EON</i></div><div class="night" id="clock"></div></div><main id="game"></main><div class="footer">BALTIMORE AFTER DARK • L3EON</div></div><script>
const S={cash:100,fans:12,fame:0,rep:0,skill:1,energy:100,day:1,location:"Neighborhood"},g=document.getElementById('game');function save(){localStorage.l3bad=JSON.stringify(S)}function load(){try{Object.assign(S,JSON.parse(localStorage.l3bad)||{})}catch(e){}}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),900)}function stat(){return `<div class="stats"><div class="stat">💵<b>$${S.cash}</b></div><div class="stat">👥<b>${S.fans}</b></div><div class="stat">⭐<b>${S.fame}</b></div><div class="stat">🗣️<b>${S.rep}</b></div><div class="stat">🔥<b>${S.skill}</b><div class="energy"><span style="width:${S.energy}%"></span></div></div></div>`}function tick(){S.day++;S.energy=Math.min(100,S.energy+55);save();clock.textContent=`DAY ${S.day} • ${S.energy>65?'8 PM':S.energy>30?'11:30 PM':'2 AM'}`}function spend(n){if(S.energy<n){toast('😮‍💨 Too tired');return false}S.energy-=n;return true}function goal(){return S.fame<30?'Get your first taste of the spotlight.':S.fans<150?'Build a local following.':S.rep<80?'Raise your reputation.':'Take L3EON to the main stage.'}function menu(){clock.textContent=`DAY ${S.day} • 8 PM`;g.innerHTML=stat()+`<section class="card hero"><div class="heroIcon">🌃🎤</div><h1>BALTIMORE<br>AFTER DARK</h1><p>Build L3EON from neighborhood talent into a Baltimore headliner.</p><span class="badge">${S.location.toUpperCase()}</span><button class="btn" onclick="city()">🌃 ENTER THE CITY</button><button class="btn alt" onclick="profile()">👑 MY L3EON</button></section><section class="card"><h3>TONIGHT'S OBJECTIVE</h3><p>${goal()}</p></section>`}function city(){g.innerHTML=stat()+`<section class="card"><h2>🌃 CHOOSE YOUR MOVE</h2><p>The city is awake. What are you doing tonight?</p><div class="grid"><button class="tile" onclick="drum()"><span>🥁</span><b>The Line</b><small>Drum battles<br>Cash + skill</small></button><button class="tile" onclick="mic()"><span>🎤</span><b>The Stage</b><small>Open mic<br>Fans + fame</small></button><button class="tile" onclick="work()"><span>💼</span><b>The Grind</b><small>Earn cash<br>Safe move</small></button><button class="tile" onclick="explore()"><span>🚗</span><b>Explore</b><small>Random encounter<br>Risk + reward</small></button></div></section><section class="card"><h3>🔓 UNLOCKS</h3><div class="list"><span>Downtown</span><b>${S.fans>=100?'OPEN':'100 fans'}</b></div><div class="list"><span>The Industry</span><b>${S.fame>=100?'OPEN':'100 fame'}</b></div><div class="list"><span>Main Stage</span><b>${S.rep>=120?'OPEN':'120 rep'}</b></div></section>`}function result(t,i,p){g.innerHTML=stat()+`<section class="card hero"><div class="heroIcon">${i}</div><h2>${t}</h2><p>${p}</p><button class="btn" onclick="city()">BACK TO CITY</button></section>`}function drum(){if(!spend(28))return;let c=35+S.skill*12;S.cash+=c;S.fame+=8;S.fans+=12;S.rep+=14;if(Math.random()<.25)S.skill++;tick();result('THE LINE','🥁',`You enter a hard-hitting drum battle. The crowd feels the pocket and you leave with $${c}.`)}function mic(){if(!spend(24))return;let n=20+S.skill*7;S.fans+=n;S.fame+=15;S.rep+=9;S.cash+=25;tick();result('OPEN MIC','🎤',`You grab the mic and give them a taste of L3EON. ${n} new people follow you.`)}function work(){if(!spend(15))return;let p=65+Math.floor(Math.random()*45);S.cash+=p;S.rep+=3;tick();result('THE GRIND','💼',`You put in the hours and stack $${p}. Not glamorous—but the bankroll is growing.`)}function explore(){if(!spend(20))return;let e=[['THE PRODUCER','🎛️','A local producer hears your demo.',25,12],['THE RIVAL','😤','A rival talks reckless. You keep your cool.',10,25],['THE FAN','💜','A stranger recognizes you and asks for a photo.',10,45],['THE OPPORTUNITY','📲','Someone offers you a small paid performance.',30,30]][Math.floor(Math.random()*4)];S.fame+=e[3];S.rep+=e[4];if(e[0]=='THE OPPORTUNITY')S.cash+=100;if(e[0]=='THE RIVAL')S.cash+=30;tick();result(e[0],e[1],e[2])}function profile(){g.innerHTML=stat()+`<section class="card hero"><div class="heroIcon">👑</div><h2>L3EON PROFILE</h2><p>From the line to the lights.</p></section><section class="card"><div class="list"><span>Career Level</span><b>${S.fans>=500?'👑 HEADLINER':S.fans>=250?'🔥 BREAKOUT':S.fans>=100?'🌟 LOCAL STAR':'🎤 RISING ARTIST'}</b></div><div class="list"><span>Days Active</span><b>${S.day}</b></div><div class="list"><span>Area</span><b>${S.location}</b></div></section><section class="card"><button class="btn" onclick="city()">🌃 KEEP BUILDING</button><button class="btn alt" onclick="localStorage.removeItem('l3bad');location.reload()">RESET CAREER</button></section>`}load();menu();</script></body></html>
